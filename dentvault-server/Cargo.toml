[package]
name = "dentvault-server"
version = "0.1.0"
description = "DentVault clinic server — one process owning dentvault.db and the vault folder, serving workstations in connected mode (ROADMAP_MULTI_COMPUTER.md Phase 1)"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "dentvault-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.8"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
